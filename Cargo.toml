[package]
name = "bitchat-console"
version = "0.1.0"
edition = "2024"
description = "BitChat console for location channels (geohash): read and write a cell and its 8 neighbours through Tor, DMs, mixed groups, in the browser."
license = "GPL-3.0-only"
repository = "https://github.com/wvmscs/bitchat-console"

# Own workspace: the crate builds on its own, also inside the local `Nostr/`
# directory, whose workspace does not list it.
[workspace]

[dependencies]
# Relay selection and geohash arithmetic (decision D2): own repository.
geohash-relays = { git = "ssh://git@github.com/wvmscs/geohash-relays.git", branch = "main" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
# Keys (lot 3): one secp256k1 key per cell, the Noise identity.
k256 = { version = "0.13", default-features = false, features = ["schnorr", "std"] }
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time"] }
