[package]
name = "bitchat-console"
version = "0.1.0"
edition = "2024"
# A second binary, `bitchat-history` (lot 17): `cargo run` runs the console.
default-run = "bitchat-console"
description = "BitChat console for location channels (geohash): read and write a cell and its 8 neighbours through Tor, DMs, mixed groups, in the browser."
license = "GPL-3.0-or-later"
repository = "https://github.com/wvmscs/bitchat-console"

# Own workspace: the crate builds on its own, also inside the local `Nostr/`
# directory, whose workspace does not list it.
[workspace]

[dependencies]
# Relay selection and geohash arithmetic (decision D2): own repository.
geohash-relays = { git = "https://github.com/wvmscs/geohash-relays.git", tag = "v0.1.0" }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
# Keys (lot 3): one secp256k1 key per cell, the Noise identity.
k256 = { version = "0.13", default-features = false, features = ["schnorr", "std"] }
sha2 = "0.10"
hmac = "0.12"
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = "2"
# Private messages (lot 6): the BitChat envelope (HKDF, XChaCha20-Poly1305)
# and the packets the app may compress (raw DEFLATE, decompression only).
hkdf = "0.12"
chacha20poly1305 = "0.10"
miniz_oxide = "0.8"
# Relays (lot 4): WebSocket over the Tor stream, TLS with the web roots.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Local storage (lot 8, D16): mutes, saved and scheduled messages.
# 0.40: the range Arti accepts (one sqlite3 link only).
rusqlite = { version = "0.40", features = ["bundled", "functions"] }
# Web server and page (lot 7), as in bitchat-geohash.
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
hyper = { version = "1", features = ["server", "client", "http1", "http2"] }
http-body-util = "0.1"
hyper-util = { version = "0.1", features = ["server-auto", "tokio", "service"] }
rustls-pki-types = { version = "1.9", features = ["std"] }
# Tor in the binary (lot 11, feature `arti`), like the iOS app.
arti-client = { version = "0.47", optional = true, default-features = false, features = ["tokio", "rustls", "compression"] }
tor-rtcompat = { version = "0.47", optional = true, default-features = false, features = ["tokio", "rustls"] }
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "signal", "net", "io-util", "time", "sync"] }

[features]
default = []
# Tor in the binary (Arti) instead of a Tor daemon.
arti = ["dep:arti-client", "dep:tor-rtcompat"]
